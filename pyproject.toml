[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "seqgain"
version = "0.3.1"
description = "K-mer discovery and reference breadth sequencing-effort analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Kathrin Trappe"},
  {name = "Simon H. Tausch"},
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pysam>=0.22,<0.25", "plotly>=5.24,<7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/rki-mf1/seqgain"
Issues = "https://github.com/rki-mf1/seqgain/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
seqgain = "seqgain.cli:main"
seqgain-demo = "seqgain.cli:demo_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
